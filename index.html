<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>DesignBrief AI</title>
    <!-- Fonts for the V3 Intelligence Document + backlog. Loaded here
         (with preconnect) instead of an @import inside a component
         style tag, which was render-blocking and refetched per mount. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <script>
      (function() {
        var t = localStorage.getItem('db-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <!-- Flutterwave inline checkout (loaded once; UpgradeModal calls window.FlutterwaveCheckout) -->
    <script src="https://checkout.flutterwave.com/v3.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
