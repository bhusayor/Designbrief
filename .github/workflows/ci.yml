name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Lint is informational only until the existing 302 errors are
      # burned down; remove `|| true` once `npx eslint src --quiet`
      # is clean.
      - run: npx eslint src --quiet || true
